name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    if: github.event.pull_request.draft == false
    name: Test Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # Pull LFS files (pinned compute data)
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: |
          uv venv
          uv sync --all-groups

      - name: Run tests
        continue-on-error: false
        run: uv run -m pytest

      - name: Run linting
        continue-on-error: false
        run: uv run ruff check

      - name: Check formatting
        continue-on-error: false
        run: uv run ruff format --check
